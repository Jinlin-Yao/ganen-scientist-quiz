<body>
<canvas id="stars"></canvas>
<div class="wrap" id="app"></div>
<div class="foot" style="position:relative;z-index:1">问天求索，星河一叶 · 感恩中国近现代科学家奖助学金笔试刷题舱 · 数据仅供学习交流</div>

<script src="core.js"></script>
<script src="questions.js?v=20261023-scu20"></script>
<script src="knowledge.js?v=20261023-scu20"></script>

<script>
/* ================= 星空背景 ================= */
(function(){
  const cv=document.getElementById('stars'),ctx=cv.getContext('2d');let stars=[],shoots=[];
  function resize(){cv.width=innerWidth;cv.height=innerHeight;
    stars=Array.from({length:Math.min(160,innerWidth/8)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.3+.3,t:Math.random()*6.28}));}
  resize();addEventListener('resize',resize);
  setInterval(()=>{if(Math.random()<.5&&shoots.length<2)shoots.push({x:Math.random()*cv.width*.8,y:Math.random()*cv.height*.3,vx:6+Math.random()*4,vy:2+Math.random()*2,life:1});},4000);
  (function draw(){ctx.clearRect(0,0,cv.width,cv.height);
    for(const s of stars){s.t+=.03;ctx.globalAlpha=.35+Math.sin(s.t)*.3;ctx.fillStyle='#cdd6ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();}
    for(let i=shoots.length-1;i>=0;i--){const sh=shoots[i];sh.x+=sh.vx;sh.y+=sh.vy;sh.life-=.02;
      if(sh.life<=0){shoots.splice(i,1);continue}
      const g=ctx.createLinearGradient(sh.x,sh.y,sh.x-sh.vx*8,sh.y-sh.vy*8);
      g.addColorStop(0,'rgba(255,255,255,'+sh.life+')');g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.globalAlpha=1;ctx.strokeStyle=g;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(sh.x,sh.y);ctx.lineTo(sh.x-sh.vx*8,sh.y-sh.vy*8);ctx.stroke();}
    ctx.globalAlpha=1;requestAnimationFrame(draw);})();
})();

/* ================= 数据与状态 ================= */
const META=window.BANK_META;
let BANK=[...window.QUESTION_BANK];        // 合并校情题后可能变长
let HAS_SCHOOL=false;
function mergeSchoolBank(){
  if(window.MY_SCHOOL_BANK&&window.MY_SCHOOL_BANK.length){
    BANK=[...window.QUESTION_BANK,...window.MY_SCHOOL_BANK];
    META.school=(window.MY_SCHOOL_META&&window.MY_SCHOOL_META.name)||'我的大学';
    HAS_SCHOOL=true;
  }else{ META.school=null; HAS_SCHOOL=false; }
}
const TYPE_NAME={single:'单选题',multiple:'多选题',fill:'填空题',flash:'简答闪卡'};
const store={
  get(){try{return JSON.parse(localStorage.getItem('wentian_v1'))||{}}catch(e){return{}}},
  set(d){try{localStorage.setItem('wentian_v1',JSON.stringify(d))}catch(e){console.warn('进度未能保存',e)}}
};
let data=Object.assign({rec:{},wrong:[]},store.get());
if(!data.rec||typeof data.rec!=='object'||Array.isArray(data.rec))data.rec={};
if(!Array.isArray(data.wrong))data.wrong=[];
const PEOPLE=window.PEOPLE_QUESTIONS||[];
const KNOWLEDGE={...(window.QUESTION_KNOWLEDGE||{}),...(window.PEOPLE_KNOWLEDGE||{})};
const allQuestions=()=>[...BANK,...PEOPLE];
const hasDone=q=>{const r=data.rec[q.id];return !!r&&((r.c||0)+(r.w||0)>0)};
function save(){store.set(data)}
function mark(id,ok){
  if(BANK.find(q=>q.id===id)?.status==='pending')return;
  const r=data.rec[id]||{c:0,w:0}; ok?r.c++:r.w++;r.lastCorrect=!!ok;r.lastAnsweredAt=Date.now();data.rec[id]=r;
  if(ok){data.wrong=data.wrong.filter(x=>x!==id)}

};

/* 生成单题 HTML。interactive=练习模式即时判分；exam 模式只记录答案 */
function questionHTML(q,interactive,examState){
  const E=examState||{};
  let body='';
  if(q.type==='single'||q.type==='multiple'){
    const multi=q.type==='multiple';
    const sel=interactive?P.sel:(E.sel||[]);
    const revealed=interactive&&P.answered;
    body=q.options.map((o,i)=>{
      let cls='opt';
      if(revealed){
        const ok=Array.isArray(q.answer)?q.answer.includes(i):q.answer===i;
        if(ok)cls+=' right';
        else if(sel.includes(i))cls+=' wrong';
      }else if(sel.includes(i))cls+=' sel';
      return `<div class="${cls}" onclick="pick(${i})"><span class="key">${'ABCD'[i]}</span><span>${o}</span></div>`;
    }).join('');
    if(interactive){
      body+=`<div class="btns">${multi&&!P.answered?`<button class="btn btn-main" onclick="reveal()">提交答案</button>`:''}
      ${!multi&&!P.answered?`<span style="color:var(--sub);font-size:13px;align-self:center">点击选项直接作答</span>`:''}</div>`;
    }else{
      body+=multi?`<div class="flash-hint">多选题：点选所有正确选项</div>`:'';
    }
  }else if(q.type==='fill'){
    const val=interactive?(P.fillValue||''):(E.text||'');
    body=`<input class="fill-input" id="fillIn" placeholder="在横线处填入答案，多个空用空格或逗号隔开" value="${escapeHTML(val)}" ${interactive&&P.answered?'disabled':''}
      oninput="${interactive?'practiceDraft(this.value)':'examText(this.value)'}">`;
    if(interactive&&!P.answered)body+=`<div class="btns"><button class="btn btn-main" onclick="gradeFill()">核对答案</button></div>`;
  }else{ // flash
    if(interactive){
      body=`<div class="flash-face" onclick="reveal()"><div>${P.answered?'':q.question?'<div style="font-size:15px">'+q.question+'</div>':''}<div class="flash-hint" style="margin-top:14px">👆 点击卡片查看参考答案</div></div></div>`;
      if(P.answered)body='';
    }else{
      body=`<div class="flash-hint">简答题：先口述作答，交卷后对照参考答案自评得分</div>`;
    }
  }
  let ans='';
  if((interactive&&P.answered)||E.showAns){
    ans=`<div class="ansbox"><b>参考答案</b><br>${answerText(q)}</div>${optionExplanationsHTML(q,interactive?P.sel:E.sel)}${knowledgeHTML(q)}`;
    if(interactive){
      if(P.reviewOnly){ans+='<p class="flash-hint">正在复习解析，本题不新增作答记录。</p><button class="btn btn-ghost" onclick="retryReviewedQuestion()">重新作答</button>';}
      else if(q.status==='pending'){ans+='<p class="flash-hint">本题待核查，不记入掌握或错题。</p>';}
      else if(q.type==='fill'||q.type==='flash'){
        if(P.manualGrade!==undefined)ans+=`<p class="study-feedback">${P.manualGrade?'✓ 已标记为掌握':'已加入错题，稍后再复习'}，可以先阅读知识点资料，再进入下一题。</p>`;
        ans+=`<div class="btns"><button class="btn btn-green" onclick="selfMark(true)">✓ 我答对了</button><button class="btn btn-red" onclick="selfMark(false)">✗ 没答上来</button></div>`;
      }
      ans+=`<div class="btns">${P.i<P.list.length-1?`<button class="btn btn-main" onclick="nextQ()">下一题 →</button>`:`<button class="btn btn-main" onclick="practiceDirectory()">完成 🎉</button>`}${P.i>0?`<button class="btn btn-ghost" onclick="prevQ()">← 上一题</button>`:''}</div>`;
    }
  }
  const qtext=(interactive&&q.type==='flash'&&P.answered)?`<div class="qtext">${q.question}</div>`:(q.type!=='flash'||!interactive?`<div class="qtext">${q.question}</div>`:'');
  if(P.autoGrade!==undefined&&interactive&&q.type==='fill'&&P.answered)ans=`<p class="flash-hint">自动核对：${P.autoGrade?'正确':'未匹配参考答案'}。如为合理同义答案，可在下方自评修正。</p>`+ans;
  return metaBadges(q)+qtext+body+ans+((interactive&&P.answered)||E.showAns?sourceHTML(q):'');
}
function answerText(q){
  if(q.type==='single')return `${'ABCD'[q.answer]}. ${q.options[q.answer]}`;
  if(q.type==='multiple')return q.answer.map(i=>`${'ABCD'[i]}. ${q.options[i]}`).join('<br>');
  return q.answer;
}
window.pick=i=>{

    <div class="exam-nav">${nav}</div>
    <div class="progress-line"><span>第 ${EX.i+1} / ${EX.list.length} 题</span></div>
    <div class="qcard">${questionHTML(q,false,{sel:(EX.ans[q.id]||{}).sel||[],text:(EX.ans[q.id]||{}).text||''})}
      <div class="btns">
        ${EX.i>0?`<button class="btn btn-ghost" onclick="examNav(${EX.i-1})">← 上一题</button>`:''}
        ${EX.i<EX.list.length-1?`<button class="btn btn-main" onclick="examNav(${EX.i+1})">下一题 →</button>`:''}
        <button class="btn btn-red" onclick="if(confirm('确定交卷吗？'))submitExam()">交卷</button>
      </div></div>`;
}
window.submitExam=()=>{
  if(EX.over)return;EX.over=true;
  if(EX.timer)clearInterval(EX.timer);
  let score=0;EX.review=[];
  for(const q of EX.list){
    const a=EX.ans[q.id]||{};let got=0,max=0,ok=null;
    if(q.type==='single'){max=2;ok=a.sel&&a.sel[0]===q.answer;got=ok?2:0}
    else if(q.type==='multiple'){max=4;const s=a.sel||[];ok=s.length===q.answer.length&&q.answer.every(i=>s.includes(i));got=ok?4:0}
    else if(q.type==='fill'){max=2;const v=(a.text||'').replace(/\s/g,'');ok=QuizCore.checkFill(q,v);got=ok?2:0}
    else{max=10;ok=null;got=null}
    if(ok!==null){score+=got;mark(q.id,ok)}
    EX.review.push({q,got,max,ok,beforeScore:{record:data.rec[q.id]?{...data.rec[q.id]}:null,wrong:data.wrong.includes(q.id)}});
  }
  EX.score=score;EX.selfAdded=0;go({name:'examResult'});
};
window.selfScore=(idx,pts)=>{
  const r=EX.review[idx];if(r.got===pts)return;if(r.got!==null)restoreGrade(r.q,r.beforeScore);r.got=pts;r.ok=pts>0;
  mark(r.q.id,pts>0);render();
};
function renderExamResult(){
  const auto=EX.review.filter(r=>r.q.type!=='flash'&&r.got!==null).reduce((s,r)=>s+r.got,0);
  const flashPending=EX.review.filter(r=>r.got===null).length;
  const rows=EX.review.map((r,i)=>{
    const g=r.got===null?`<span style="color:var(--sub)">待自评</span>`:(r.ok?`<span style="color:var(--green)">+${r.got}</span>`:`<span style="color:var(--red)">0</span>`);
    return `<div class="opt" style="cursor:default"><span class="key">${i+1}</span><span style="flex:1">${r.q.question.slice(0,38)}${r.q.question.length>38?'…':''}</span><span>${g}/${r.max}</span></div><details class="qcard" style="margin-bottom:12px"><summary>查看本题答案与解析</summary><p>${r.q.question}</p><div class="ansbox">${answerText(r.q)}${r.q.note?`<p class="note">${r.q.note}</p>`:''}</div>${optionExplanationsHTML(r.q,EX.ans[r.q.id]?.sel)}${knowledgeHTML(r.q)}${sourceHTML(r.q)}</details>`;
  }).join('');
  const flashCards=EX.review.map((r,i)=>({r,i})).filter(x=>x.r.q.type==='flash').map(({r,i})=>`
    <div class="qcard" style="margin-top:14px">${metaBadges(r.q)}<div class="qtext">${r.q.question}</div>
    <div class="ansbox"><b>参考答案</b><br>${r.q.answer}</div>${knowledgeHTML(r.q)}
    <div class="btns">自评得分：
      <button class="btn ${r.got===0?'btn-red':'btn-ghost'}" onclick="selfScore(${i},0)">0分</button>
      <button class="btn ${r.got===5?'btn-green':'btn-ghost'}" onclick="selfScore(${i},5)">5分</button>
      <button class="btn ${r.got===10?'btn-green':'btn-ghost'}" onclick="selfScore(${i},10)">10分</button>
    </div></div>`).join('');
  const total=EX.review.reduce((s,r)=>s+(r.got||0),0);
  app.innerHTML=topbar('成绩单')+`
    <div class="qcard"><div class="result">
      <div class="score">${total}</div>
      <div class="sub">卷面满分 100 分 ｜ 客观题已判 ${auto} 分${flashPending?` ｜ 还有 ${flashPending} 道简答待自评`:''}</div>
      <div class="sub">折算入总评（×20%）：<b style="color:var(--gold)">${(total*0.2).toFixed(1)} 分</b></div>
      <div class="btns" style="justify-content:center"><button class="btn btn-main" onclick="startExam()">再考一次</button><button class="btn btn-ghost" onclick="go({name:'home'})">回到首页</button></div>
    </div></div>
    ${flashCards}
    <h3 style="margin:22px 0 10px;font-size:15px">逐题明细</h3>${rows}`;
}


let C=Object.assign({query:'',topic:'all',status:'study',completion:'todo',type:'all',page:0},data.catalog||{});
function saveCatalog(){data.catalog={...C};save()}
function catalogRows(ignoreCompletion=false){
 return BANK.filter(q=>(C.topic==='all'||q.topic===C.topic)&&(C.type==='all'||q.type===C.type)&&(C.status==='all'||(C.status==='study'?q.status!=='pending':q.status===C.status))&&(!C.query||QuizCore.normalize(q.question+' '+answerText(q)).includes(QuizCore.normalize(C.query)))&&(ignoreCompletion||C.completion==='all'||(C.completion==='done'?hasDone(q):C.completion==='wrong'?data.wrong.includes(q.id):!hasDone(q))));
}
function completionBadge(q){
 if(q.status==='pending')return '<span class="done-badge pending">待核查</span>';
 const rec=data.rec[q.id];
 if(!hasDone(q))return '<span class="done-badge todo">未做过</span>';
 if(data.wrong.includes(q.id))return '<span class="done-badge wrong">已做 · 待复习</span>';
 return '<span class="done-badge done">已做过</span>';
}
function catalogHTML(){
 const topics=[...new Set(BANK.map(q=>q.topic))],base=catalogRows(true),rows=catalogRows(),pages=Math.max(1,Math.ceil(rows.length/25));C.page=Math.max(0,Math.min(C.page,pages-1));saveCatalog();
 const tabs=[['todo','未做过',base.filter(q=>!hasDone(q)).length],['done','已做过',base.filter(hasDone).length],['wrong','错题',base.filter(q=>data.wrong.includes(q.id)).length],['all','全部',base.length]];
 return `<section class="directory"><div class="directory-title"><h2>题目目录</h2><span>点击题目，直接开始</span></div>
 <div class="completion-tabs" role="tablist" aria-label="作答状态">${tabs.map(([key,label,count])=>`<button role="tab" aria-selected="${C.completion===key}" class="completion-tab ${C.completion===key?'active':''}" onclick="catalogTab('${key}')">${label}<span>${count}</span></button>`).join('')}</div>
 <form class="search-row" onsubmit="event.preventDefault();catalogSearch(this)"><input class="fill-input" name="query" aria-label="搜索全部题目" placeholder="搜索人物、成果或题目关键词" value="${escapeHTML(C.query)}"><select name="topic" aria-label="专题"><option value="all">全部专题</option>${topics.map(t=>`<option ${C.topic===t?'selected':''}>${escapeHTML(t)}</option>`).join('')}</select><select name="type" aria-label="题型"><option value="all">全部题型</option>${Object.entries(TYPE_NAME).map(([key,title])=>`<option value="${key}" ${C.type===key?'selected':''}>${title}</option>`).join('')}</select><button class="btn btn-main">筛选 / 搜索</button></form>
 <p class="directory-count">找到 ${rows.length} 题 · 第 ${C.page+1} / ${pages} 页${C.query?' · <button class="text-button" onclick="clearCatalogSearch()">清除搜索</button>':''}</p>
 <div class="question-list">${rows.slice(C.page*25,C.page*25+25).map(q=>`<button class="question-row" onclick="openCatalogQuestion('${q.id}')"><span class="question-number">${BANK.indexOf(q)+1}</span><span class="question-content"><span class="question-title">${escapeHTML(q.question)}</span><span class="question-subtitle">${escapeHTML(q.topic)} · ${q.judgment?'判断题':TYPE_NAME[q.type]}${data.rec[q.id]?.lastAnsweredAt?' · 上次 '+new Date(data.rec[q.id].lastAnsweredAt).toLocaleDateString('zh-CN'):''}</span></span>${completionBadge(q)}<span class="row-arrow">→</span></button>`).join('')||'<div class="empty">这个分组暂时没有题目。可切换“全部”或调整筛选。</div>'}</div>
 <div class="directory-bottom"><span>每页 25 题 · 作答状态自动保存</span><div class="btns">${C.page>0?'<button class="btn btn-ghost" onclick="catalogPage(-1)">上一页</button>':''}${C.page+1<pages?'<button class="btn btn-ghost" onclick="catalogPage(1)">下一页</button>':''}${rows.length?'<button class="btn btn-main" onclick="practiceCatalog()">练习当前分组 →</button>':''}</div></div></section>`;
}
function renderCatalog(){app.innerHTML=topbar('我的题目目录')+resumeCard()+catalogHTML()}
window.catalogSearch=form=>{C.query=form.elements.query.value;C.topic=form.elements.topic.value;C.type=form.elements.type?.value||'all';C.status=C.topic==='待核查'?'pending':'study';C.page=0;render()};

function openCatalogQuestion(id){
 const rows=catalogRows();let index=rows.findIndex(q=>q.id===id);const list=index<0?BANK.filter(q=>q.status!=='pending'):rows;index=list.findIndex(q=>q.id===id);if(index<0)return;
 P={qs:[...list],list:[...list],i:index,pool:true,random:false,filter:{sec:'all',type:'all',topic:'all',status:'all'},query:''};resetDraft();view={name:'practice'};render();scrollTo(0,0);
}

 const names={official:'官方资料',handbook:'川大版复习手册',integrated:'复习整合资料',preparation:'奖学金准备',elan:'ELAN整理版',upstream:'原项目题库'};
 return `<section class="option-analysis" aria-label="逐项解析"><div class="knowledge-heading"><span>🔎</span><div><h3>逐项解析</h3><p>每个选项都看一遍，把易混知识一起记住。</p></div></div><div class="analysis-summary"><span class="eyebrow">本题关键</span><p>${escapeHTML(info.summary)}</p></div>${info.options.map((item,i)=>`<article class="option-analysis-item ${item.correct?'is-correct':''}"><div class="option-analysis-title"><span class="analysis-letter">${String.fromCharCode(65+i)}</span><h4>${escapeHTML(q.options[i])}</h4><span class="analysis-verdict">${item.correct?'✓ 应选':'本题不选'}${selection?.includes(i)?' · 你选了此项':''}</span></div>${item.paragraphs.map(p=>`<p>${escapeHTML(p)}</p>`).join('')}<details class="source-details"><summary>本项依据与来源</summary><p>${item.references.map(r=>escapeHTML(names[r.document]||r.document)+' · '+escapeHTML(r.location)).join('；')}</p>${item.links.map(l=>`<p><a href="${escapeHTML(l.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(l.title)} ↗</a></p>`).join('')}</details></article>`).join('')}<aside class="analysis-memory"><span class="eyebrow">对照记忆</span><p>${escapeHTML(info.memory)}</p></aside></section>`;
}
function knowledgeHTML(q){
 const materials=KNOWLEDGE[q.id];if(!materials)return '';
 const sourceNames={handbook:'川大版复习手册',integrated:'复习整合资料',preparation:'奖学金准备',elan:'ELAN整理版',upstream:'原项目题库'};
 return `<section class="knowledge-panel"><div class="knowledge-heading"><span>📖</span><div><h3>知识点资料</h3><p>做完这一题，把相关知识一起记住。</p></div></div>${materials.paragraphs.map(item=>`<div class="knowledge-excerpt"><span class="eyebrow">${escapeHTML(item.kind)}</span><p>${escapeHTML(item.text)}</p><div class="knowledge-citation">${(item.references||[]).slice(0,3).map(r=>`${sourceNames[r.document]||r.document} · ${escapeHTML(r.location)}`).join('；')}${(item.links||[]).slice(0,1).map(link=>` · <a href="${escapeHTML(link.url)}" target="_blank" rel="noopener noreferrer">查看原文 ↗</a>`).join('')}</div></div>`).join('')}</section>`;
}
